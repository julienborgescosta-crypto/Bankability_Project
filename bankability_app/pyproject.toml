[project]
name = "bankability_app"
version = "0.1.0"
description = "Outil de bancabilite pour projets de stockage batterie (BESS) : ingestion de Business Plan Excel, moteur financier (IRR/NPV/DSCR), analyses de scenarios, sensibilite, stress-test et dashboard de risques."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "numpy>=1.26",
    "numpy-financial>=1.0",
    "openpyxl>=3.1",
    "plotly>=5.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.coverage.run]
source = ["core", "ui"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "sample_data/build_sample_xlsx.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
